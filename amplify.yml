version: 1
# Static site: `next build` with `output: 'export'` writes plain HTML/CSS/JS to `out/`.
# No backend (no Cognito, Data or Storage) and no server runtime.
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - node -v && npm -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
